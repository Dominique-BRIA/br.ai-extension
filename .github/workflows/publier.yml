name: Publier l'extension

# Automatique quand package.json change sur main : une version déjà publiée est ignorée, seul un
# nouveau numéro part donc. Aussi à la demande (onglet Actions → Run workflow) ou par une étiquette
# de version (v0.5.1).
# Construit le .vsix, puis le publie sur Open VSX (Cursor, Windsurf…) si le secret OVSX_PAT est
# défini, et sur le Marketplace de VS Code par Trusted Publishing : aucune clé à garder, une règle
# de confiance créée sur le Marketplace désigne ce dépôt et ce fichier.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      # Le protocole partagé vient du dépôt backend, attendu dans ../backend.
      - uses: actions/checkout@v4
        with:
          path: extension
      - uses: actions/checkout@v4
        with:
          repository: Dominique-BRIA/br.ai-backend
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension

      - name: Vérifier que l'étiquette correspond à la version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: extension
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $version."
            exit 1
          fi

      - run: npm run check
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - run: npx vsce package --no-dependencies --out br-ia.vsix
        working-directory: extension

      - uses: actions/upload-artifact@v4
        with:
          name: br-ia-vsix
          path: extension/br-ia.vsix

      - name: Publier sur Open VSX
        if: env.OVSX_PAT != ''
        working-directory: extension
        run: |
          # L'espace de noms n'est à créer qu'une fois : l'erreur s'il existe déjà est sans effet.
          npx --yes ovsx@1.3.0 create-namespace br-ia || true
          npx --yes ovsx@1.3.0 publish br-ia.vsix --skip-duplicate

      # En dernier : sans règle de confiance, cette étape échoue et le signale, sans bloquer Open VSX.
      - name: Publier sur le Marketplace de VS Code
        working-directory: extension
        run: npx vsce publish --packagePath br-ia.vsix --skip-duplicate --oidc
